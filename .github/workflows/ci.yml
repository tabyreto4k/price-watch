name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format & lint
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest

      # Гейт покрытия здесь исключён намеренно: домен и джоб проверяются интеграционными
      # тестами, и без их данных счёт заведомо не сойдётся. Порог считается ниже, когда
      # отработали оба прогона.
      - name: Build & unit tests
        run: ./gradlew build -x integrationTest -x jacocoTestCoverageVerification

      - name: Integration tests
        run: ./gradlew integrationTest

      - name: Coverage report
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification

      - name: Покрытие в summary
        if: always()
        run: |
          report=build/reports/jacoco/test/jacocoTestReport.xml
          [ -f "$report" ] || exit 0
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import re, sys
          xml = open(sys.argv[1]).read()
          missed, covered = map(int, re.findall(
              r'<counter type="INSTRUCTION" missed="(\d+)" covered="(\d+)"/>', xml)[-1])
          print("### Покрытие\n")
          print(f"**{covered / (missed + covered):.1%}** по инструкциям.")
          print("Гейт считает то же без `config/`, `dto/` и точки входа, порог — 70%.")
          PY

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 7
