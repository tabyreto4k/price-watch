spring:
  application:
    name: price-watch
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pricewatch}
    username: ${POSTGRES_USER:pricewatch}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Схему держит Flyway; Hibernate только сверяется с ней и падает при расхождении.
      ddl-auto: validate

pricewatch:
  bot:
    token: ${BOT_TOKEN}
  monitor:
    check-interval: ${CHECK_INTERVAL:PT30M}
    # Первый прогон не сразу после старта: дать приложению устояться.
    initial-delay: PT1M
    max-source-failures: 3
  source:
    # Честный User-Agent с контактом — часть уважительного обращения с чужим API.
    user-agent: "PriceWatchBot/0.1 (+https://github.com/tabyreto4k/price-watch)"
    connect-timeout: 3s
    read-timeout: 5s
    retry-attempts: 3
    retry-backoff: 1s
    wildberries:
      card-url: "https://card.wb.ru/cards/v2/detail?appType=1&curr=rub&dest=-1257786&nm="
      requests-per-second: 1.0
    html-page:
      requests-per-second: 0.5
      # Ключи — это и есть allow-list доменов. Новый магазин добавляется строкой конфига,
      # без кода. Скобки обязательны: иначе Spring разрежет ключ по точкам.
      selectors:
        "[books.toscrape.com]": ".price_color"

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    ru.pricewatch: ${LOG_LEVEL:INFO}
