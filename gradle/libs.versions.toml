[versions]
springBoot = "3.5.16"
springDependencyManagement = "1.1.7"
spotless = "7.0.2"
checkstyle = "10.21.4"
palantirJavaFormat = "2.57.0"
jacoco = "0.8.12"
telegrambots = "10.2.1"
resilience4j = "2.4.0"
jsoup = "1.23.2"
# Держать вровень с okhttp из BOM Spring Boot: сам BOM mockwebserver не версионирует.
mockwebserver = "4.12.0"

[libraries]
# Стартер тянет за собой telegrambots-longpolling, но не клиент: OkHttpTelegramClient
# лежит в отдельном артефакте, и без него отправлять нечем.
telegrambots-starter = { module = "org.telegram:telegrambots-springboot-longpolling-starter", version.ref = "telegrambots" }
telegrambots-client = { module = "org.telegram:telegrambots-client", version.ref = "telegrambots" }

# Только rate limiter: аннотации и AOP из resilience4j-spring-boot3 здесь не нужны,
# лимитеры строятся из проперти руками.
resilience4j-ratelimiter = { module = "io.github.resilience4j:resilience4j-ratelimiter", version.ref = "resilience4j" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
