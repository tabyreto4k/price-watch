# Локальная разработка: Postgres и бот на dev-токене. Прод живёт в compose.prod.yml.
name: price-watch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricewatch}
      POSTGRES_USER: ${POSTGRES_USER:-pricewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
    # Наружу порт не светим: он нужен только psql с этой же машины.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pricewatch} -d ${POSTGRES_DB:-pricewatch}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  bot:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?возьми токен у @BotFather и положи в .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pricewatch}
      POSTGRES_USER: ${POSTGRES_USER:-pricewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
